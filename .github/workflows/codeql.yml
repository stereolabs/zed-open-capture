name: CodeQL

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Every Monday: new queries can find problems in code that did not change
    - cron: '30 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libhidapi-libusb0 libhidapi-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      # Only the library: the examples include third party code
      - name: Build
        run: |
          cmake -S . -B build -DBUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
